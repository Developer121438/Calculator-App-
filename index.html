<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="images/Screenshot 2026-08-28 092220.png" />
  </head>
  <body>
    <div class="container">
      <div class="calculator">
        <div id="button-btn">
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
        </div>
        <h3 class="calculator-title2">Standard Calculator</h3>
        <div class="link-container">
          <div id="calculator">
            <h4 id="hcalc">Calculator</h4>
            <a href="index.html" class="active">Standard</a>
            <a href="scientific.html">Scientific</a>
            <a href="graphing.html">Graphing</a>
            <a href="programmer.html">Programmer</a>
            <a href="date.html">Date Calculation</a>
          </div>
        </div>
        <form id="calculator-form">
          <div class="display">
            <span id="memory-indicator">M</span>
            <input type="text" id="display" name="display" value="0" readonly />
          </div>

          <!-- Row 1 -->
          <div class="button">
            <input
              type="button"
              value="AC"
              onclick="clearDisplay()"
              class="operator"
            />
            <input
              type="button"
              value="DE"
              onclick="deleteLast()"
              class="operator"
            />
            <input
              type="button"
              value="."
              onclick="appendDecimal()"
              class="operator"
            />
            <input
              type="button"
              value="/"
              onclick="appendOperator('/')"
              class="operator"
            />
            <input
              type="button"
              value="MC"
              onclick="memoryClear()"
              class="memory"
            />
          </div>

          <!-- Row 2 -->
          <div class="button">
            <input type="button" value="7" onclick="appendNumber('7')" />
            <input type="button" value="8" onclick="appendNumber('8')" />
            <input type="button" value="9" onclick="appendNumber('9')" />
            <input
              type="button"
              value="*"
              onclick="appendOperator('*')"
              class="operator"
            />
            <input
              type="button"
              value="MR"
              onclick="memoryRecall()"
              class="memory"
            />
          </div>

          <!-- Row 3 -->
          <div class="button">
            <input type="button" value="4" onclick="appendNumber('4')" />
            <input type="button" value="5" onclick="appendNumber('5')" />
            <input type="button" value="6" onclick="appendNumber('6')" />
            <input
              type="button"
              value="-"
              onclick="appendOperator('-')"
              class="operator"
            />
            <input
              type="button"
              value="M+"
              onclick="memoryAdd()"
              class="memory"
            />
          </div>

          <!-- Row 4 -->
          <div class="button">
            <input type="button" value="1" onclick="appendNumber('1')" />
            <input type="button" value="2" onclick="appendNumber('2')" />
            <input type="button" value="3" onclick="appendNumber('3')" />
            <input
              type="button"
              value="+"
              onclick="appendOperator('+')"
              class="operator"
            />
            <input
              type="button"
              value="M-"
              onclick="memorySubtract()"
              class="memory"
            />
          </div>

          <!-- Row 5 -->
          <div class="button">
            <input type="button" value="00" onclick="appendNumber('00')" />
            <input type="button" value="0" onclick="appendNumber('0')" />
            <input
              type="button"
              value="="
              onclick="calculate()"
              class="equal"
            />
            <input
              type="button"
              value="MS"
              onclick="memoryStore()"
              class="memory"
            />
          </div>
        </form>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
